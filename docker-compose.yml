services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Each collection's RocksDB segments hold many open file handles;
    # accumulating several test/scratch collections (Parent-Child ablation
    # work) hit the container's default nofile limit ("Too many open files").
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      # local model cache persists across container restarts — bge-base +
      # bge-reranker-base are a few hundred MB, no reason to re-download
      # every `docker compose up`
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  hf_cache:
